<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Beto | Galeria de Pets</title>

  <link rel="stylesheet" href="../styles/variavel.css">

  <link rel="stylesheet" href="../styles/navbar.css">

<body>

<header class="navbar">
  <nav class="navbar__container">
    <div class="navbar__logotipo">
      <img src="../assets/logo/logotipo_vira-lar.png" alt="Logotipo Vira-lar">

    <ul class="navbar__navegation">
      <li><a href="../index.html">Home</a></li>

<main>
  <section class="container">

    <h1 class="titulo-pet">Galeria de <span>Pets</span></h1>

    <div class="pet-detalhe">

      <img

        alt="Beto"
        class="pet-detalhe__img"

      <div class="pet-detalhe__info">
        <h2>Beto</h2>

          Voltar para a galeria

<footer class="footer">
